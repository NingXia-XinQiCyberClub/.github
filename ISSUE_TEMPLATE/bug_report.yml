name: 缺陷报告
description: 报告功能异常、运行错误或结果不符合预期的问题
title: "[Bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先检索既有工单，确认该问题未被报告。

        > 涉及凭据泄露或安全缺陷的，不得使用本表单，应按
        > [SECURITY.md](https://github.com/NingXia-XinQiCyberClub/.github/blob/main/SECURITY.md) 私下上报。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 已检索既有工单，确认非重复报告
          required: true
        - label: 已阅读[贡献指南](https://github.com/NingXia-XinQiCyberClub/.github/blob/main/CONTRIBUTING.md)
          required: true
        - label: 本问题不涉及安全缺陷或凭据泄露
          required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述
      description: 说明实际表现与预期结果
      placeholder: |
        执行 <命令> 后出现 <现象>。
        预期结果应为 <结果>。
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 提供最小可复现路径
      placeholder: |
        1. 克隆仓库并切换至 main 分支
        2. 执行 python main.py
        3. 选择功能项 2，输入端口 1111
        4. 出现异常
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 错误输出
      description: "完整粘贴文本输出，不使用截图，不省略中间行"
      render: shell
      placeholder: |
        Traceback (most recent call last):
          File "main.py", line 12, in <module>
            ...
        ValueError: <异常信息>
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 操作系统
      placeholder: Windows 11 / macOS 14.5 / Ubuntu 22.04
    validations:
      required: true

  - type: input
    id: runtime
    attributes:
      label: 运行时版本
      placeholder: Python 3.11.7 / Node 20.11.0 / g++ 13.2
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 仓库与提交
      placeholder: <仓库名> @ main (commit a1b2c3d)
    validations:
      required: false

  - type: textarea
    id: tried
    attributes:
      label: 已尝试的措施
      description: 说明已执行的排查步骤，以避免重复建议
      placeholder: |
        - 重新安装依赖，问题依旧
        - 切换至 Python 3.10，问题依旧
    validations:
      required: false
