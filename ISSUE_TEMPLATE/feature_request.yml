name: 功能建议
description: 提出新增功能、改进点或新项目方向
title: "[Feature] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        提交前应先明确待解决的问题，再讨论实现方案。
        尚未形成明确方案的设想，建议先在 [Discussions → Ideas](https://github.com/NingXia-XinQiCyberClub/.github/discussions/categories/ideas) 中讨论。

  - type: textarea
    id: problem
    attributes:
      label: 待解决的问题
      description: 说明现有方案在何处不足，以及该不足造成的具体影响
      placeholder: |
        现有流程要求每次演练前手工修改转发地址，易产生配置错误，
        且更换设备后需重新配置。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 建议方案
      description: 说明期望的行为与接口形式
      placeholder: |
        支持从配置文件读取转发地址，
        并提供 --config 参数指定配置文件路径。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 说明已评估的其他方案及其未被采纳的原因
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 单个仓库的小范围变更
        - 单个仓库的较大范围变更
        - 涉及多个仓库
        - 新建项目
    validations:
      required: true

  - type: checkboxes
    id: contribute
    attributes:
      label: 参与意向
      options:
        - label: 可承担实现工作
        - label: 可协助测试
        - label: 仅提出建议，暂不参与实现

  - type: textarea
    id: extra
    attributes:
      label: 补充材料
      description: 相关截图、参考实现或文献
    validations:
      required: false
