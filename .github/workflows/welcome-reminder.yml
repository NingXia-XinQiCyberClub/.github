name: 新成员提醒

# 发现飞书群里的新成员，@ 他先去 GitHub 填写加入工单。
#
# 群自定义机器人读不到成员名单，因此本工作流需要企业自建应用：
#   FEISHU_APP_ID          应用 App ID
#   FEISHU_APP_SECRET      应用 App Secret
#   FEISHU_CHAT_ID_RECRUIT 招新群 chat_id，未配置时用 FEISHU_CHAT_ID
# 另需额外权限 im:chat.members:read（读取群成员）。
#
# 成员快照保存在 feishu-state 分支的 feishu-members.json，不进 main。
# 首次运行只记录名单不发提醒，避免把现有成员全部 @ 一遍。
#
# 默认关闭：仅在仓库变量 WELCOME_REMINDER 显式设为 on 时才运行。
# 常规做法是改用群公告引导新人，见 README 第 7.3C 节。
#
# 停用时不产生任何 Actions 用量，因此保留定时表达式不会造成浪费。

on:
  schedule:
    # 每 10 分钟一次。GitHub 定时任务在高峰期可能延迟，实际间隔会在 10~25 分钟之间。
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: feishu-welcome
  cancel-in-progress: false

jobs:
  remind:
    if: vars.WELCOME_REMINDER == 'on'
    runs-on: ubuntu-latest
    steps:
      - name: 取得脚本
        run: |
          for file in notify.py welcome.py; do
            curl -fsSL --retry 3 \
              "https://raw.githubusercontent.com/NingXia-XinQiCyberClub/.github/main/scripts/feishu/$file" \
              -o "$file"
          done

      - name: 提醒新成员
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
          FEISHU_CHAT_ID_RECRUIT: ${{ secrets.FEISHU_CHAT_ID_RECRUIT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 welcome.py
