name: 首次交互自动应答

# 在成员首次提交工单或变更请求时自动回复规范提示。
# 本文件位于组织级 .github 仓库，仅对该仓库生效。
# 若需覆盖全部仓库，应将该文件复制至各仓库的 .github/workflows/ 目录。

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  respond:
    runs-on: ubuntu-latest
    steps:
      - name: 首次交互提示
        uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            本仓库已收到您的首次工单。

            为提高处理效率，请确认以下事项：
            - 已检索既有工单，确认非重复报告
            - 已附完整错误输出（文本形式，非截图）
            - 已说明操作系统与运行时版本

            提问规范见 [SUPPORT.md](https://github.com/NingXia-XinQiCyberClub/.github/blob/main/SUPPORT.md)，
            入门流程见 [CONTRIBUTING.md](https://github.com/NingXia-XinQiCyberClub/.github/blob/main/CONTRIBUTING.md)。

            > 涉及安全缺陷或凭据泄露的，不得公开讨论，应按
            > [SECURITY.md](https://github.com/NingXia-XinQiCyberClub/.github/blob/main/SECURITY.md) 私下上报。

          pr-message: |
            本仓库已收到您的首次变更请求。

            维护者将在 48 小时内完成评审。等待期间请确认：
            - 未包含密码、令牌、私钥、真实 flag 或内网地址
            - 提交信息符合规范
            - 持续集成检查通过

            流程说明见 [CONTRIBUTING.md](https://github.com/NingXia-XinQiCyberClub/.github/blob/main/CONTRIBUTING.md)。
