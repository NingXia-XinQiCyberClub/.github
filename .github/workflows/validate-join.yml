name: 加入申请格式校验

# 校验加入社团申请工单中的学号格式（11 位数字）。
# 格式不符时自动回复提示并添加 needs-info 标签，修正后自动移除。

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  validate:
    if: contains(github.event.issue.labels.*.name, 'membership')
    runs-on: ubuntu-latest
    steps:
      - name: 校验学号
        uses: actions/github-script@v7
        with:
          script: |
            const MARKER = '<!-- student-id-validation -->';
            const issue = context.payload.issue;
            const body = issue.body || '';

            // 从表单生成的正文中提取「学号」字段的值
            const match = body.match(/###\s*学号\s*[\r\n]+([^\r\n]*)/);
            const raw = match ? match[1].trim() : '';
            const valid = /^\d{11}$/.test(raw);

            const { owner, repo } = context.repo;
            const issue_number = issue.number;

            // 查找此前由本工作流留下的评论
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const previous = comments.find((c) => c.body && c.body.includes(MARKER));

            const labels = (issue.labels || []).map((l) => (typeof l === 'string' ? l : l.name));

            if (valid) {
              if (previous) {
                await github.rest.issues.deleteComment({
                  owner, repo, comment_id: previous.id,
                });
              }
              if (labels.includes('needs-info')) {
                await github.rest.issues.removeLabel({
                  owner, repo, issue_number, name: 'needs-info',
                }).catch(() => {});
              }
              core.info(`学号格式有效：${raw}`);
              return;
            }

            // 格式无效
            const detail = raw === ''
              ? '未读取到学号字段的值'
              : `当前填写内容为 \`${raw}\``;

            const message = [
              MARKER,
              '### 学号格式校验未通过',
              '',
              `${detail}。`,
              '',
              '学号应为 **11 位数字**，例如 `12024242193`。',
              '',
              '请点击右上角 **Edit** 修改工单正文中的学号，保存后系统将自动重新校验。',
              '',
              '若确认学号无误但仍提示错误，请在本工单内回复说明。',
            ].join('\n');

            if (previous) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: previous.id, body: message,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body: message,
              });
            }

            if (!labels.includes('needs-info')) {
              await github.rest.issues.addLabels({
                owner, repo, issue_number, labels: ['needs-info'],
              });
            }

            core.warning(`学号格式无效：${raw || '(空)'}`);
