name: 新成员入职登记
description: 新成员入门流程的第一步，按清单逐项完成并登记
title: "[入职] "
labels: ["onboarding"]
body:
  - type: markdown
    attributes:
      value: |
        ## 入职流程

        本工单作为入职任务清单使用，按顺序逐项完成，预计耗时 30 分钟。
        每完成一项即勾选对应条目。全部完成后，维护者将开通相应仓库权限。

        执行过程中遇到阻碍，应在本工单内回复说明具体环节，不得跳过。

  - type: input
    id: name
    attributes:
      label: 称呼
      description: 姓名或固定使用的昵称
      placeholder: 张三 / zs
    validations:
      required: true

  - type: input
    id: github
    attributes:
      label: GitHub 用户名
      placeholder: "@username"
    validations:
      required: true

  - type: dropdown
    id: grade
    attributes:
      label: 年级
      options:
        - 大一
        - 大二
        - 大三
        - 大四
        - 研究生
        - 其他
    validations:
      required: true

  - type: dropdown
    id: interest
    attributes:
      label: 研究兴趣
      multiple: true
      options:
        - Web 安全
        - Pwn / 二进制
        - Reverse 逆向工程
        - Crypto 密码学
        - Misc
        - 内网渗透与红队技术
        - 安全工具开发
        - 尚未确定
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: 入职清单
      description: 按顺序完成，逐项勾选
      options:
        - label: "步骤 1：启用两步验证（GitHub → Settings → Password and authentication）"
          required: true
        - label: "步骤 2：安装 Git，并配置 user.name 与 user.email"
          required: true
        - label: "步骤 3：配置认证方式（SSH 密钥或 gh auth login）"
          required: true
        - label: "步骤 4：阅读[贡献指南](https://github.com/NingXia-XinQiCyberClub/.github/blob/main/CONTRIBUTING.md)"
          required: true
        - label: "步骤 5：克隆任一组织仓库至本地"
          required: true
        - label: "步骤 6：完成首次变更请求"
          required: true
        - label: "步骤 7：在 [Discussions](https://github.com/NingXia-XinQiCyberClub/.github/discussions) 中完成自我介绍"
          required: true
        - label: "步骤 8：加入组织通讯群组并参加例会（联系负责人获取入群方式）"
          required: false

  - type: textarea
    id: stuck
    attributes:
      label: 受阻环节
      description: 说明受阻的具体步骤与错误输出
    validations:
      required: false

  - type: checkboxes
    id: agreement
    attributes:
      label: 承诺事项
      options:
        - label: 已阅读并同意[行为准则](https://github.com/NingXia-XinQiCyberClub/.github/blob/main/CODE_OF_CONDUCT.md)
          required: true
        - label: 承诺仅对授权环境实施安全测试，不对学校信息系统或他人设备实施未授权测试
          required: true
